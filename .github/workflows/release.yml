name: Release

# On every push to main: work out the next version, write it to pyproject.toml,
# commit it, tag it vX.Y.Z and publish a GitHub Release with generated notes.
#
# Bump size comes from the commit messages since the last tag (Conventional Commits):
#   "feat!: ..." / "fix!: ..." or "BREAKING CHANGE" in the body  -> major  (1.2.3 -> 2.0.0)
#   "feat: ..." / "feat(ui): ..."                                 -> minor  (1.2.3 -> 1.3.0)
#   anything else                                                 -> patch  (1.2.3 -> 1.2.4)
# You can also run it by hand (Actions → Release → Run workflow) and pick the bump.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write # push the version commit + tag, create the release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump version and publish release
    runs-on: ubuntu-latest
    # Skip the commit this workflow pushes itself (pushes made with GITHUB_TOKEN
    # don't trigger workflows anyway; this is a second guard).
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags + history to decide the bump

      - uses: astral-sh/setup-uv@v7

      - name: Decide bump
        id: bump
        env:
          REQUESTED: ${{ inputs.bump || 'auto' }}
        run: |
          if [ "$REQUESTED" != "auto" ]; then
            echo "level=$REQUESTED" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${last_tag:+$last_tag..}HEAD
          log=$(git log --format='%s%n%b' "$range")
          if grep -qE '^[a-z]+(\([^)]*\))?!:|BREAKING CHANGE' <<<"$log"; then level=major
          elif grep -qE '^feat(\([^)]*\))?:' <<<"$log"; then level=minor
          else level=patch; fi
          echo "Commits since ${last_tag:-the beginning} -> $level bump"
          echo "level=$level" >> "$GITHUB_OUTPUT"

      - name: Bump pyproject.toml and uv.lock
        id: version
        run: |
          uv version --bump "${{ steps.bump.outputs.level }}"
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --title "v$VERSION" --generate-notes --verify-tag
