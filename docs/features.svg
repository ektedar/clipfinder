<g><g transform="translate(680 0)"><rect width="320" height="150" rx="18" fill="#14161c" stroke="#262a35"/><rect x="22" y="0" width="276" height="3" rx="1.5" fill="#ffb020"/><rect x="22" y="24" width="52" height="52" rx="14" fill="#ffb020" fill-opacity=".14"/><text x="48" y="60" font-size="28" text-anchor="middle">💬</text><text x="90" y="58" font-size="19" font-weight="700" fill="#f4f5f8">Auto captions</text><text x="24" y="108" font-size="14.5" fill="#9aa0b2">Local Whisper, 1–3 bold words at a</text><text x="24" y="130" font-size="14.5" fill="#9aa0b2">time, spoken word highlighted</text></g></g>
