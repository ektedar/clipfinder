<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151026"/>
      <stop offset=".55" stop-color="#0e0f13"/>
      <stop offset="1" stop-color="#1a0f14"/>
    </linearGradient>
    <linearGradient id="word" x1="0" x2="1">
      <stop offset="0" stop-color="#ff3d6e"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".2" cy=".1" r=".6"><stop offset="0" stop-color="#ff3d6e" stop-opacity=".28"/><stop offset="1" stop-color="#ff3d6e" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx=".85" cy=".9" r=".55"><stop offset="0" stop-color="#ffb020" stop-opacity=".18"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .bar { fill: #3a3f4f; transform-box: fill-box; transform-origin: 50% 100%; animation: eq 1.6s ease-in-out infinite alternate; }
      .hot { fill: url(#word); animation: eq 1.1s ease-in-out infinite alternate, hot 3.2s ease-in-out infinite; }
      @keyframes eq { from { transform: scaleY(.55); } to { transform: scaleY(1); } }
      @keyframes hot { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
      .head { animation: sweep 6s linear infinite; }
      @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1040px); } }
      .chip { animation: float 4s ease-in-out infinite alternate; }
      .chip2 { animation: float 4s ease-in-out -2s infinite alternate; }
      @keyframes float { from { transform: translateY(0); } to { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow1)"/>
    <rect width="1200" height="340" fill="url(#glow2)"/>

    <!-- wordmark -->
    <g transform="translate(80 128)">
      <!-- play-badge logo -->
      <rect x="0" y="-62" width="70" height="70" rx="20" fill="url(#word)"/>
      <rect x="23" y="-48" width="24" height="42" rx="5" fill="none" stroke="#0e0f13" stroke-width="4"/>
      <path d="M31 -34 L 41 -27 L 31 -20 Z" fill="#0e0f13"/>
      <text x="92" y="0" font-size="78" font-weight="800" letter-spacing="-2" fill="#f4f5f8">Clip<tspan fill="url(#word)">Finder</tspan></text>
    </g>
    <text x="82" y="180" font-size="24" fill="#b9bdca" font-weight="500">Long streams in. <tspan fill="#f4f5f8" font-weight="700">Viral-ready shorts out.</tspan></text>

    <!-- floating chips -->
    <g class="chip" font-size="15" font-weight="700">
      <rect x="840" y="58" width="134" height="34" rx="17" fill="#ff3d6e" fill-opacity=".16" stroke="#ff3d6e" stroke-opacity=".5"/>
      <text x="907" y="80" fill="#ff7a9a" text-anchor="middle">🔥 hype found</text>
    </g>
    <g class="chip2" font-size="15" font-weight="700">
      <rect x="990" y="98" width="128" height="34" rx="17" fill="#33d69f" fill-opacity=".14" stroke="#33d69f" stroke-opacity=".5"/>
      <text x="1054" y="120" fill="#5fe3b6" text-anchor="middle">📱 9:16 ready</text>
    </g>
    <g class="chip" font-size="15" font-weight="700">
