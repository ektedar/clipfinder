<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#ff3d6e"/><stop offset="1" stop-color="#ffb020"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a6b"/><stop offset="1" stop-color="#14233f"/></linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a6b"/><stop offset="1" stop-color="#14233f"/></linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3d35"/><stop offset="1" stop-color="#1a2620"/></linearGradient>
    <clipPath id="tv"><rect x="40" y="110" width="400" height="225" rx="10"/></clipPath>
    <clipPath id="ph"><rect x="707" y="40" width="186" height="330" rx="18"/></clipPath>
    <g id="game">
      <!-- stylised gameplay: horizon, hills, crosshair, target -->
      <path d="M0 150 C 60 110, 120 130, 180 105 S 320 120, 400 95 L 400 225 L 0 225 Z" fill="#1f3b5a"/>
      <path d="M0 185 C 80 160, 170 175, 250 150 S 360 170, 400 160 L 400 225 L 0 225 Z" fill="#274b38"/>
      <rect x="250" y="112" width="26" height="40" rx="4" fill="#ff3d6e"/>
      <circle cx="263" cy="104" r="10" fill="#ff3d6e"/>
      <circle cx="200" cy="112" r="16" fill="none" stroke="#e9ebf1" stroke-width="2"/>
      <line x1="200" y1="90" x2="200" y2="134" stroke="#e9ebf1" stroke-width="2"/>
      <line x1="178" y1="112" x2="222" y2="112" stroke="#e9ebf1" stroke-width="2"/>
    </g>
    <g id="face">
      <circle cx="0" cy="0" r="22" fill="#f2c09b"/>
      <path d="M-24 -6 C -22 -30, 22 -30, 24 -6 C 14 -16, -14 -16, -24 -6 Z" fill="#3a2418"/>
      <circle cx="-8" cy="2" r="3" fill="#0e0f13"/><circle cx="8" cy="2" r="3" fill="#0e0f13"/>
      <ellipse cx="0" cy="12" rx="8" ry="6" fill="#0e0f13"/>
      <path d="M-40 60 C -38 30, 38 30, 40 60 Z" fill="#ff3d6e"/>
      <rect x="-34" y="-20" width="10" height="26" rx="5" fill="#262a35"/><rect x="24" y="-20" width="10" height="26" rx="5" fill="#262a35"/>
      <path d="M-29 -20 C -28 -42, 28 -42, 29 -20" fill="none" stroke="#262a35" stroke-width="5"/>
    </g>
    <style>
      .w1 { animation: w1 2.4s steps(1) infinite; }
      .w2 { animation: w2 2.4s steps(1) infinite; }
      .w3 { animation: w3 2.4s steps(1) infinite; }
      @keyframes w1 { 0% { fill: #ffe600; } 33.3% { fill: #ffffff; } }
      @keyframes w2 { 0% { fill: #ffffff; } 33.3% { fill: #ffe600; } 66.6% { fill: #ffffff; } }
      @keyframes w3 { 0% { fill: #ffffff; } 66.6% { fill: #ffe600; } }
      .ph { animation: play 7s linear infinite; }
      @keyframes play { from { transform: translateX(0); } to { transform: translateX(400px); } }
      .pk { animation: pulse 1.8s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
      .cam { animation: cam 2.4s ease-in-out infinite alternate; }
      @keyframes cam { from { stroke-opacity: .45; } to { stroke-opacity: 1; } }
      .flow { stroke-dasharray: 10 8; animation: flow 1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -18; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1000" height="440" rx="20" fill="#0e0f13"/>

  <!-- ===== Source: 16:9 stream ===== -->
  <text x="40" y="92" fill="#8a90a2" font-size="13" font-weight="600" letter-spacing=".08em">3-HOUR STREAM · 16:9</text>
  <g clip-path="url(#tv)">
    <rect x="40" y="110" width="400" height="225" fill="url(#sky)"/>
    <use href="#game" x="40" y="110"/>
    <rect x="330" y="235" width="104" height="94" rx="6" fill="url(#cam)" stroke="#33d69f" stroke-width="2.5" class="cam"/>
    <use href="#face" transform="translate(382 280) scale(.75)"/>
  </g>
  <rect x="40" y="110" width="400" height="225" rx="10" fill="none" stroke="#262a35" stroke-width="2"/>
  <rect x="330" y="225" width="64" height="16" rx="8" fill="#33d69f"/>
  <text x="362" y="237" fill="#0e0f13" font-size="10" font-weight="800" text-anchor="middle">WEBCAM</text>
  <!-- scrubber with hype peaks -->
  <rect x="40" y="350" width="400" height="6" rx="3" fill="#262a35"/>
  <rect class="pk" x="140" y="347" width="18" height="12" rx="3" fill="url(#acc)"/>
  <rect class="pk" x="236" y="347" width="18" height="12" rx="3" fill="url(#acc)"/>
  <rect class="pk" x="318" y="347" width="18" height="12" rx="3" fill="url(#acc)"/>
  <rect class="pk" x="386" y="347" width="18" height="12" rx="3" fill="url(#acc)"/>
  <g class="ph"><rect x="39" y="342" width="2" height="22" rx="1" fill="#f4f5f8"/><circle cx="40" cy="342" r="4" fill="#f4f5f8"/></g>
  <text x="40" y="384" fill="#8a90a2" font-size="13">The best moments get found automatically</text>

  <!-- ===== Arrow ===== -->
  <line class="flow" x1="470" y1="222" x2="640" y2="222" stroke="#ff7a45" stroke-width="4" stroke-linecap="round"/>
  <path d="M630 210 L 648 222 L 630 234" fill="none" stroke="#ffb020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="556" y="200" fill="#e9ebf1" font-size="22" font-weight="800" text-anchor="middle">Clip<tspan fill="#ff3d6e">Finder</tspan></text>
  <text x="556" y="256" fill="#8a90a2" font-size="12" text-anchor="middle">find · reframe · caption</text>

  <!-- ===== Output: 9:16 short ===== -->
  <rect x="697" y="30" width="206" height="350" rx="26" fill="#171920" stroke="#262a35" stroke-width="2"/>
  <g clip-path="url(#ph)">
    <rect x="707" y="40" width="186" height="116" fill="url(#cam)"/>
    <use href="#face" transform="translate(800 92) scale(1.2)"/>
    <rect x="707" y="156" width="186" height="214" fill="url(#sky2)"/>
    <use href="#game" transform="translate(631 160) scale(.85 1)"/>
    <line x1="707" y1="156" x2="893" y2="156" stroke="#0e0f13" stroke-width="2"/>
  </g>
  <!-- caption sitting on the seam -->
  <g font-size="18" font-weight="900" text-anchor="middle" stroke="#0e0f13" stroke-width="5" paint-order="stroke" letter-spacing=".02em">
    <text x="800" y="164"><tspan class="w1" fill="#ffffff">NO WAY</tspan> <tspan class="w2" fill="#ffffff">HE</tspan> <tspan class="w3" fill="#ffffff">HIT</tspan></text>
  </g>
  <!-- phone UI hints -->
  <circle cx="872" cy="250" r="9" fill="#e9ebf1" fill-opacity=".85"/>
  <circle cx="872" cy="278" r="9" fill="#e9ebf1" fill-opacity=".85"/>
  <circle cx="872" cy="306" r="9" fill="#e9ebf1" fill-opacity=".85"/>
  <rect x="720" y="336" width="90" height="8" rx="4" fill="#e9ebf1" fill-opacity=".8"/>
  <rect x="720" y="350" width="60" height="6" rx="3" fill="#e9ebf1" fill-opacity=".5"/>
  <text x="800" y="404" fill="#8a90a2" font-size="13" font-weight="600" text-anchor="middle" letter-spacing=".08em">1080×1920 SHORT · 9:16</text>

  <!-- badges -->
  <g font-size="12" font-weight="700">
    <rect x="474" y="300" width="170" height="26" rx="13" fill="#ff3d6e" fill-opacity=".14"/>
    <text x="559" y="317" fill="#ff3d6e" text-anchor="middle">Webcam on top</text>
    <rect x="474" y="334" width="170" height="26" rx="13" fill="#ffb020" fill-opacity=".14"/>
    <text x="559" y="351" fill="#ffb020" text-anchor="middle">Word-by-word captions</text>
    <rect x="474" y="368" width="170" height="26" rx="13" fill="#33d69f" fill-opacity=".14"/>
    <text x="559" y="385" fill="#33d69f" text-anchor="middle">HD, up to 1080p60</text>
  </g>
</svg>
