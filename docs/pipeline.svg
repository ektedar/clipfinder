<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 205" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="95" y1="0" x2="905" y2="0"><stop offset="0" stop-color="#ff3d6e"/><stop offset="1" stop-color="#ffb020"/></linearGradient></defs>
<style>.f{stroke-dasharray:8 10;animation:f 1.2s linear infinite}@keyframes f{to{stroke-dashoffset:-18}}.dot{animation:run 6s ease-in-out infinite}@keyframes run{from{transform:translateX(0)}to{transform:translateX(810px)}}.n{animation:glow 6s ease-in-out infinite}@keyframes glow{0%,100%{stroke-opacity:.4}50%{stroke-opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1000" height="205" rx="20" fill="#0e0f13"/>
<line x1="95" y1="78" x2="905" y2="78" stroke="#262a35" stroke-width="4" stroke-linecap="round"/>
<line class="f" x1="95" y1="78" x2="905" y2="78" stroke="url(#g)" stroke-width="4" stroke-linecap="round"/>
<g class="dot"><circle cx="95" cy="78" r="14" fill="#fff" fill-opacity=".15"/><circle cx="95" cy="78" r="6" fill="#fff"/></g>
<circle cx="95" cy="78" r="34" fill="#14161c"/>
<circle class="n" style="animation-delay:0s" cx="95" cy="78" r="34" fill="none" stroke="url(#g)" stroke-width="2.5"/>
<text x="95" y="88" font-size="28" text-anchor="middle">🔗</text>
<text x="95" y="144" font-size="15.5" font-weight="700" fill="#f4f5f8" text-anchor="middle">Paste a link</text>
<text x="95" y="166" font-size="12.5" fill="#8a90a2" text-anchor="middle">YouTube, Twitch</text><text x="95" y="183" font-size="12.5" fill="#8a90a2" text-anchor="middle">or a local file</text>
<circle cx="257" cy="78" r="34" fill="#14161c"/>
<circle class="n" style="animation-delay:1s" cx="257" cy="78" r="34" fill="none" stroke="url(#g)" stroke-width="2.5"/>
<text x="257" y="88" font-size="28" text-anchor="middle">🎧</text>
<text x="257" y="144" font-size="15.5" font-weight="700" fill="#f4f5f8" text-anchor="middle">Listen + watch</text>
<text x="257" y="166" font-size="12.5" fill="#8a90a2" text-anchor="middle">loudness, reactions</text><text x="257" y="183" font-size="12.5" fill="#8a90a2" text-anchor="middle">and fast action</text>
<circle cx="419" cy="78" r="34" fill="#14161c"/>
<circle class="n" style="animation-delay:2s" cx="419" cy="78" r="34" fill="none" stroke="url(#g)" stroke-width="2.5"/>
<text x="419" y="88" font-size="28" text-anchor="middle">📊</text>
<text x="419" y="144" font-size="15.5" font-weight="700" fill="#f4f5f8" text-anchor="middle">Score</text>
<text x="419" y="166" font-size="12.5" fill="#8a90a2" text-anchor="middle">each moment vs. the</text><text x="419" y="183" font-size="12.5" fill="#8a90a2" text-anchor="middle">minute around it</text>
<circle cx="581" cy="78" r="34" fill="#14161c"/>
<circle class="n" style="animation-delay:3s" cx="581" cy="78" r="34" fill="none" stroke="url(#g)" stroke-width="2.5"/>
<text x="581" y="88" font-size="28" text-anchor="middle">✂️</text>
<text x="581" y="144" font-size="15.5" font-weight="700" fill="#f4f5f8" text-anchor="middle">Pick moments</text>
<text x="581" y="166" font-size="12.5" fill="#8a90a2" text-anchor="middle">the top peaks,</text><text x="581" y="183" font-size="12.5" fill="#8a90a2" text-anchor="middle">10–15 s each</text>
<circle cx="743" cy="78" r="34" fill="#14161c"/>
<circle class="n" style="animation-delay:4s" cx="743" cy="78" r="34" fill="none" stroke="url(#g)" stroke-width="2.5"/>
<text x="743" y="88" font-size="28" text-anchor="middle">🎬</text>
<text x="743" y="144" font-size="15.5" font-weight="700" fill="#f4f5f8" text-anchor="middle">Render</text>
<text x="743" y="166" font-size="12.5" fill="#8a90a2" text-anchor="middle">HD 9:16, webcam</text><text x="743" y="183" font-size="12.5" fill="#8a90a2" text-anchor="middle">and captions</text>
<circle cx="905" cy="78" r="34" fill="#14161c"/>
<circle class="n" style="animation-delay:5s" cx="905" cy="78" r="34" fill="none" stroke="url(#g)" stroke-width="2.5"/>
<text x="905" y="88" font-size="28" text-anchor="middle">🚀</text>
<text x="905" y="144" font-size="15.5" font-weight="700" fill="#f4f5f8" text-anchor="middle">Rank + ship</text>
<text x="905" y="166" font-size="12.5" fill="#8a90a2" text-anchor="middle">a virality score</text><text x="905" y="183" font-size="12.5" fill="#8a90a2" text-anchor="middle">for every clip</text>
</svg>
