<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a6b"/><stop offset="1" stop-color="#14233f"/></linearGradient>
    <linearGradient id="cam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3d35"/><stop offset="1" stop-color="#1a2620"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="scene">
      <rect width="300" height="170" fill="url(#sky)"/>
      <path d="M0 110 C 50 80, 100 95, 150 75 S 250 90, 300 70 L 300 170 L 0 170 Z" fill="#1f3b5a"/>
      <path d="M0 140 C 60 120, 130 130, 190 112 S 270 128, 300 120 L 300 170 L 0 170 Z" fill="#274b38"/>
      <rect x="150" y="80" width="22" height="34" rx="4" fill="#ff3d6e"/><circle cx="161" cy="73" r="9" fill="#ff3d6e"/>
    </g>
    <g id="face">
      <circle r="20" fill="#f2c09b"/><path d="M-22 -5 C -20 -28, 20 -28, 22 -5 C 13 -14, -13 -14, -22 -5 Z" fill="#3a2418"/>
      <circle cx="-7" cy="2" r="3" fill="#0e0f13"/><circle cx="7" cy="2" r="3" fill="#0e0f13"/><ellipse cy="11" rx="7" ry="5" fill="#0e0f13"/>
      <path d="M-38 56 C -36 28, 36 28, 38 56 Z" fill="#ff3d6e"/>
    </g>
    <clipPath id="p1"><rect x="80" y="40" width="140" height="249" rx="14"/></clipPath>
    <clipPath id="p2"><rect x="380" y="40" width="140" height="249" rx="14"/></clipPath>
    <clipPath id="p3"><rect x="680" y="40" width="140" height="249" rx="14"/></clipPath>
  </defs>
  <rect width="900" height="360" rx="20" fill="#0e0f13"/>

  <!-- facecam -->
  <g clip-path="url(#p1)">
    <rect x="80" y="40" width="140" height="87" fill="url(#cam)"/>
    <use href="#face" transform="translate(150 80)"/>
    <use href="#scene" transform="translate(20 127) scale(.86 .95)"/>
  </g>
  <rect x="80" y="40" width="140" height="249" rx="14" fill="none" stroke="#262a35" stroke-width="2"/>
  <text x="150" y="318" fill="#e9ebf1" font-size="16" font-weight="700" text-anchor="middle">facecam</text>
  <text x="150" y="340" fill="#8a90a2" font-size="12.5" text-anchor="middle">webcam stacked over gameplay</text>

  <!-- crop -->
  <g clip-path="url(#p2)">
    <use href="#scene" transform="translate(220 40) scale(1.465)"/>
  </g>
  <rect x="380" y="40" width="140" height="249" rx="14" fill="none" stroke="#262a35" stroke-width="2"/>
  <text x="450" y="318" fill="#e9ebf1" font-size="16" font-weight="700" text-anchor="middle">crop</text>
  <text x="450" y="340" fill="#8a90a2" font-size="12.5" text-anchor="middle">centre crop that fills the screen</text>

  <!-- blur -->
  <g clip-path="url(#p3)">
    <g filter="url(#blur)" opacity=".75"><use href="#scene" transform="translate(520 40) scale(1.465)"/></g>
    <use href="#scene" transform="translate(680 125) scale(.4667)"/>
  </g>
  <rect x="680" y="40" width="140" height="249" rx="14" fill="none" stroke="#262a35" stroke-width="2"/>
  <text x="750" y="318" fill="#e9ebf1" font-size="16" font-weight="700" text-anchor="middle">blur</text>
  <text x="750" y="340" fill="#8a90a2" font-size="12.5" text-anchor="middle">whole frame on a blurred backdrop</text>
</svg>
