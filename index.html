<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Finder</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #171920; --line: #262a35; --text: #e9ebf1; --muted: #8a90a2;
    --accent: #ff3d6e; --accent2: #ffb020; --ok: #33d69f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 40px 16px 80px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text] { flex: 1 1 380px; min-width: 0; background: #0b0c10; border: 1px solid var(--line); color: var(--text);
         border-radius: 10px; padding: 13px 14px; font-size: 15px; outline: none; }
  input[type=text]:focus { border-color: var(--accent); }
  button { background: var(--accent); color: white; border: 0; border-radius: 10px; padding: 0 22px;
           font-weight: 600; font-size: 15px; cursor: pointer; min-height: 46px; }
  button:disabled { opacity: .5; cursor: default; }
  .opts { margin-top: 14px; display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 14px; align-items: center; }
  .opts label { display: flex; gap: 8px; align-items: center; }
  .opts input[type=number], .opts select { background: #0b0c10; color: var(--text); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 8px; width: 64px; font-size: 14px; }
  .opts select { width: auto; }
  #status { margin-top: 22px; display: none; }
  .bar { height: 8px; background: #0b0c10; border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }
  .msg { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
  .err { color: #ff6b6b; }
  #results { margin-top: 28px; display: none; }
  #results h2 { font-size: 18px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
  canvas { width: 100%; height: 120px; display: block; }
  .legend { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }
  .clip { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; scroll-margin-top: 20px; }
  .clip.flash { border-color: var(--accent); }
  .clip video { width: 100%; aspect-ratio: 9/16; background: #000; display: block; }
  .clip .info { padding: 10px 12px 12px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px;
           background: rgba(255,61,110,.14); color: var(--accent); font-weight: 600; }
  .badge.lay { background: rgba(51,214,159,.12); color: var(--ok); margin-top: 4px; }
  .clip .cap { font-size: 13px; margin-top: 8px; color: var(--text); opacity: .85; }
  .opts input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .clip .t { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
  .clip a { color: var(--text); font-size: 13px; text-decoration: none; border: 1px solid var(--line);
            border-radius: 8px; padding: 6px 10px; display: inline-block; }
  .clip a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Clip<span>Finder</span></h1>
  <p class="sub">Paste a YouTube or Twitch link. It finds the loudest, most reactive, most action-packed moments and cuts vertical 9:16 clips for Reels, TikTok and Shorts.</p>

  <div class="card">
    <form id="f" class="row">
      <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=…  or  https://www.twitch.tv/videos/…" autocomplete="off">
      <button id="go">Find clips</button>
    </form>
    <div class="opts">
      <label>Clips <input id="count" type="number" min="1" max="15" value="5"></label>
      <label>Length <input id="min" type="number" min="5" max="60" value="10"> – <input id="max" type="number" min="5" max="60" value="15"> s</label>
      <label>Framing
        <select id="mode">
          <option value="facecam">Webcam on top + gameplay (auto-detect)</option>
          <option value="crop">Center crop (fills screen)</option>
          <option value="blur">Fit + blurred background</option>
        </select>
      </label>
      <label><input id="caps" type="checkbox" checked> Auto captions</label>
      <label id="camwrap">Webcam size
        <select id="cam">
          <option value="0.3">30% of height</option>
          <option value="0.35" selected>35%</option>
          <option value="0.4">40%</option>
          <option value="0.5">50% (half)</option>
        </select>
      </label>
    </div>
  </div>

  <div id="status" class="card">
    <div class="msg"><span id="msg">Starting…</span><span id="pct">0%</span></div>
    <div class="bar"><div id="fill"></div></div>
  </div>

  <section id="results">
    <div class="card">
      <h2 id="title"></h2>
      <div class="meta" id="meta"></div>
      <canvas id="chart"></canvas>
      <div class="legend">Excitement over the whole video. Pink bands are the clips we cut. Click one to jump to it.</div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
let lastResult = null, lastJob = null;

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  const url = $('url').value.trim();
  if (!url) return $('url').focus();
  $('go').disabled = true;
  $('results').style.display = 'none';
  $('status').style.display = 'block';
  setProgress('Starting…', 0);
  const r = await fetch('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url, count: +$('count').value, min_len: +$('min').value, max_len: +$('max').value, mode: $('mode').value, cam_frac: +$('cam').value, captions: $('caps').checked }) });
  const j = await r.json();
  if (!r.ok) return fail(j.error);
  poll(j.id);
});

function setProgress(msg, frac) {
  $('msg').textContent = msg; $('msg').className = '';
  $('pct').textContent = Math.round(frac * 100) + '%';
  $('fill').style.width = (frac * 100) + '%';
}
function fail(msg) {
  $('msg').textContent = 'Error: ' + msg; $('msg').className = 'err';
  $('go').disabled = false;
}

async function poll(id) {
  const j = await (await fetch('/api/jobs/' + id)).json();
  if (j.status === 'running') { setProgress(j.message, j.progress); return setTimeout(() => poll(id), 800); }
  if (j.status === 'error') return fail(j.error);
  setProgress('Done', 1);
  $('go').disabled = false;
  history.replaceState(null, '', '#' + id);   // shareable link back to these results
  show(id, j.result);
}
if (location.hash.length > 1) { $('status').style.display = 'block'; poll(location.hash.slice(1)); }

function show(id, res) {
  lastResult = res; lastJob = id;
  $('results').style.display = 'block';
  $('title').textContent = res.title;
  $('meta').textContent = `${fmt(res.duration)} long · ${res.clips.length} clips found` +
    (res.used_heatmap ? ' · used YouTube “most replayed” data' : '');
  $('grid').innerHTML = res.clips.map(c => `
    <div class="clip" id="clip-${c.index}">
      <video src="/clips/${id}/${encodeURIComponent(c.file)}" controls playsinline preload="metadata"></video>
      <div class="info">
        <span class="badge">${c.reason}</span>
        ${c.layout ? `<span class="badge lay">${({facecam:'Webcam detected', crop:'No webcam · center crop', blur:'Fit + blur'})[c.layout] || c.layout}</span>` : ''}
        ${c.caption ? `<div class="cap">“${c.caption.replace(/</g,'&lt;')}”</div>` : ''}
        <div class="t">#${c.index} · ${fmt(c.start)} – ${fmt(c.end)} · ${c.length.toFixed(1)}s</div>
        <a href="/clips/${id}/${encodeURIComponent(c.file)}?dl=1">Download</a>
      </div>
    </div>`).join('');
  drawChart();
}

function drawChart() {
  const res = lastResult; if (!res) return;
  const cv = $('chart'), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const { t, score } = res.timeline, D = res.duration || t[t.length - 1];
  const lo = Math.min(...score), hi = Math.max(...score);
  const x = s => s / D * W, y = v => H - 18 - (v - lo) / (hi - lo || 1) * (H - 28);

  for (const c of res.clips) {   // clip bands
    g.fillStyle = 'rgba(255,61,110,.22)'; g.fillRect(x(c.start), 0, Math.max(3, x(c.end) - x(c.start)), H - 16);
    g.fillStyle = '#ff3d6e'; g.font = '600 11px system-ui'; g.fillText('#' + c.index, x(c.start) + 2, 12);
  }
  g.beginPath(); t.forEach((s, i) => i ? g.lineTo(x(s), y(score[i])) : g.moveTo(x(s), y(score[i])));
  g.strokeStyle = '#ffb020'; g.lineWidth = 1.5; g.stroke();
  g.fillStyle = '#8a90a2'; g.font = '11px system-ui';
  g.fillText('0:00', 0, H - 3); const e = fmt(D); g.fillText(e, W - g.measureText(e).width, H - 3);
}
$('chart').addEventListener('click', ev => {
  if (!lastResult) return;
  const r = ev.target.getBoundingClientRect(), s = (ev.clientX - r.left) / r.width * lastResult.duration;
  const c = lastResult.clips.find(c => s >= c.start - 5 && s <= c.end + 5);
  if (!c) return;
  const el = $('clip-' + c.index); el.scrollIntoView({ behavior: 'smooth' });
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1200);
  el.querySelector('video').play();
});
addEventListener('resize', drawChart);
$('mode').addEventListener('change', () => $('camwrap').style.display = $('mode').value === 'facecam' ? '' : 'none');
</script>
</body>
</html>
