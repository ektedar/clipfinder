# Install once:  uv run pre-commit install      (sets up both the commit and the push hook)
# Run on everything:  uv run pre-commit run --all-files
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # --- Secrets: block commits AND pushes that contain credentials ---------
  # Commit: scans staged changes. Push: scans every commit being pushed.
  # Needs the trufflehog binary on PATH:  brew install trufflehog
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog (secret scan)
        entry: scripts/trufflehog-hook.sh
        language: script
        pass_filenames: false
        stages: [pre-commit, pre-push]

  # --- Lint + format ------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6 # keep in sync with the ruff version in uv.lock
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]

  # --- General hygiene ----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
